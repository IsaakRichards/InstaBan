name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "InstaBan-${TAG}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=InstaBan-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: InstaBan-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --title "InstaBan ${{ steps.apk.outputs.tag }}" \
            --notes "Messages-only Instagram client. Install the APK below (allow installs from unknown sources)." \
            --target "${GITHUB_SHA}" --latest
